<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">

    <title>Lista de todos los productos</title>
</head>
<body>
    <div class="container text-center mt-5">
        <div class="row">
            <div class="col-2">
    
            </div>
            <div class="col-8">
    
                <!-- <a class="btn btn-info" th:href="@{/products/lista}">Crear </a> -->
    
                <table class="table">
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Title</th>
                        <th scope="col">Author</th>
                        <th scope="col">Price</th>
                        <th scope="col">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product: ${products}">
                        <th scope="row" th:text="${product.getIdArbitro}"></th>
                        <td th:text="${product.getFechaNac}"></td>
                        <td th:text="${product.getNombre}"></td>
                        <td th:text="${product.getFederacion}"></td>
                        <td th:text="${product.getFoto}"></td>
                        <td>
                            <!-- <a class="btn btn-success" th:href="@{/products/ver/{id}(id=${product.id})}">Ver</a> -->
                            <a class="btn btn-primary" th:href="@{/products/editar/{id}(id=${product.getIdArbitro})}">editar</a>
                            <a class="btn btn-primary" th:href="@{/products/crear}">crear</a>
                            <a class="btn btn-danger" th:href="@{/products/borrar/{id}(id=${product.getIdArbitro})}">Borrar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class=" col-2">
    
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
</body>
</html>
