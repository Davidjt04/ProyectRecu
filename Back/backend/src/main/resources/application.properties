#Cambio de puerto
server.port=8081

#Nombre de la app
spring.application.name=backend
#Configuración BD
spring.datasource.url=jdbc:mysql://localhost:3306/laliga
spring.datasource.username=root
spring.datasource.password=root
#Configuración nombres tablas hibernate
#con esta linea no me cambia hiñbernate el nombre de buscqueda de las tablas ya que por defecto usa la naming starrategy quq hace que me busque en mi 
    #caso el lugar de idArbitro id_arbitro  eso se extrapola con las demas entidades
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#para que las consultas no se ejecuten durante la renderización de la vista  ya que se pueden ejecutar
#en el controlador y no en la vista3cuando las transacciones hayan terminado y provocar problemas con estas y con el rendimiento
# spring.jpa.open-in-view=false

#esta instruccion hace que hibernate cree las tablas automaticamente aplicandole los cambios que haya en codigo
spring.jpa.hibernate.ddl-auto=update
logging.level.org.hibernate.type.descriptor.sql=TRACE

