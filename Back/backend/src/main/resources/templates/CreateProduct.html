<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar producto</title>
</head>
<body>
    <form th:action="@{/products/guardar}" th:object="${producto}" method="post" class="container mt-5">
        <input type="hidden" th:field="*{idArbitro}">
        <input type="date" class="form-control" id="FechaNac" th:field="*{FechaNac}">

        <div class="mb-3">
            <label for="Nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="Nombre" th:field="*{Nombre}">
        </div>

        <div class="mb-3">
            <label for="Federacion" class="form-label">federacion</label>
            <input type="text" class="form-control" id="Federacion" th:field="*{Federacion}">
        </div>
        <div class="mb-3">
            <label for="Foto" class="form-label">foto</label>
            <input type="text" class="form-control" id="Foto" th:field="*{Foto}">
        </div>
        <!-- <input type="text" step="0.01" class="form-control" th:field="*{partidos.id}"> -->



        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
</body>
</html>
